[tools]
gleam = "latest"
erlang = "latest"
rebar = "latest"

[tasks.build]
description = "Build the library and all examples"
run = [
  "gleam build --warnings-as-errors",
  "for dir in examples/*/; do echo \"→ Building $dir\" && (cd \"$dir\" && gleam build --warnings-as-errors) || exit $?; done",
]

[tasks.test-integration]
description = "Run integration tests against an OpenAI-compatible provider"
run = "gleam test"
env = { PIG_RUN_INTEGRATION = "1" }
