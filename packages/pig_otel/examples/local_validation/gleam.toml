name = "pig_otel_local_validation"
version = "0.1.0"
target = "erlang"
description = "Local official SDK recording and OTLP delivery verification host."
licences = ["Apache-2.0"]

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_otp = ">= 1.2.0 and < 2.0.0"
gleam_http = ">= 4.3.0 and < 5.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
jscheam = ">= 2.0.0 and < 3.0.0"
pig = { path = "../../../pig" }
pig_proxy = { path = "../../../pig_proxy" }
pig_protocol = { path = "../../../pig_protocol" }
pig_otel = { path = "../.." }
opentelemetry = "== 1.7.0"
# Exporter 1.10.0 is built by the host's rebar.config. Gleam has no Hex
# overrides; grpcbox 0.18.0's ~>1.2.0 constraint excludes the OTP29 fix.

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
