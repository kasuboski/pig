name = "pig_otel"
version = "0.1.0"
target = "erlang"
description = "OpenTelemetry semantics, propagation, and opt-in conversation capture for Pig."
licences = ["Apache-2.0"]
repository = { type = "github", user = "kasuboski", repo = "pig" }

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
otel_gleam = { git = "https://github.com/kasuboski/otel_gleam.git", ref = "0ad06026ba0cdbdd3adfc9dd6ec882cfb8a1c2a5" }
pig_protocol = { path = "../pig_protocol" }
logging = ">= 1.5.0 and < 2.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
