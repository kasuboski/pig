name = "pig"
version = "0.4.0"
target = "erlang"
description = "A Gleam library for building and orchestrating agents on the BEAM."
licences = ["Apache-2.0"]
repository = { type = "github", user = "kasuboski", repo = "pig" }
links = [{ title = "GitHub", href = "https://github.com/kasuboski/pig" }]

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_crypto = ">= 1.6.0 and < 2.0.0"
telemetry = ">= 1.4.1 and < 2.0.0"
# Monorepo development link; see the root README for release sequencing.
pig_protocol = { path = "../pig_protocol" }
pig_transport = { path = "../pig_transport" }
gleam_http = ">= 4.3.0 and < 5.0.0"
gleam_httpc = ">= 5.0.0 and < 6.0.0"
logging = ">= 1.5.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
jscheam = ">= 2.0.0 and < 3.0.0"
gleam_otp = ">= 1.2.0 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
simplifile = ">= 2.2.0 and < 3.0.0"
sqlight = ">= 1.1.0 and < 2.0.0"
temporary = ">= 1.0.0 and < 2.0.0"

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
envoy = ">= 1.2.0 and < 2.0.0"
