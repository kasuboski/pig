name = "pig_proxy"
version = "0.1.0"
target = "erlang"
description = "Standalone executable proxy server for the pig agent ecosystem."
licences = ["Apache-2.0"]
repository = { type = "github", user = "kasuboski", repo = "pig" }

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_erlang = ">= 1.0.0 and < 2.0.0"
gleam_otp = ">= 1.2.0 and < 2.0.0"
gleam_http = ">= 4.0.0 and < 5.0.0"
gleam_json = ">= 3.0.0 and < 4.0.0"
mist = ">= 6.0.0 and < 7.0.0"
hackney = ">= 1.18.0 and < 2.0.0"
envoy = ">= 1.0.0 and < 2.0.0"
logging = ">= 1.0.0 and < 2.0.0"
telemetry = ">= 1.0.0 and < 2.0.0"
simplifile = ">= 2.2.0 and < 3.0.0"
filepath = ">= 1.0.0 and < 2.0.0"
pig_protocol = { path = "../pig_protocol" }
pig_transport = { path = "../pig_transport" }

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
